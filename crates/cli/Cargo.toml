[package]
name = "serial-workbench-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serial-workbench-core = { path = "../core" }
serial-workbench-client = { path = "../client" }
serial-workbench-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serial-workbench-host = { path = "../host" }
tempfile = "3"
