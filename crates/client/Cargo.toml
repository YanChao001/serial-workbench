[package]
name = "serial-workbench-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serial-workbench-core = { path = "../core" }
serial-workbench-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
