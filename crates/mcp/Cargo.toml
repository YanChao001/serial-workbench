[package]
name = "serial-workbench-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serial-workbench-core = { path = "../core" }
serial-workbench-client = { path = "../client" }
serial-workbench-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
serial-workbench-host = { path = "../host" }
tempfile = "3"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process", "io-util"] }
