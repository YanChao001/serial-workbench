[package]
name = "serial-workbench-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serial-workbench-core = { path = "../core" }
serial-workbench-ipc = { path = "../ipc" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_WindowsProgramming"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial-workbench-client = { path = "../client" }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
