[package]
name = "serial-workbench-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serial-workbench-core = { path = "../core" }
serial-workbench-ipc = { path = "../ipc" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.61.2", default-features = false, features = ["idna"] }
referencing = { version = "=0.61.2", default-features = false }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-normalization = "=0.1.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Communication", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "=0.29.0"
serial-workbench-client = { path = "../client" }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
