name: 里程碑检查
run-name: Windows Host 自动恢复专项 · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-updater-recovery:
    name: Windows 两版 Host 自动恢复
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      LEGACY_SHA: "3492986784ca3e37d06fe18fed56bed08e248071"
      CANDIDATE_SHA: "b1d7fe6c35d87dfc69f841c13b74bebc5de8b86d"
      TARGET: x86_64-pc-windows-msvc
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 初始化证据目录
        run: |
          $root = Join-Path $env:RUNNER_TEMP "swb-m3-updater"
          $evidence = Join-Path $root "evidence"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "EVIDENCE_DIR=$evidence" >> $env:GITHUB_ENV
          "FIXTURE_ROOT=$root" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $root 'target')" >> $env:GITHUB_ENV
          [ordered]@{
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflowCommit = $env:GITHUB_SHA
            runner = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            windowsVersion = [System.Environment]::OSVersion.VersionString
            target = $env:TARGET
            legacyExpectedCommit = $env:LEGACY_SHA
            candidateExpectedCommit = $env:CANDIDATE_SHA
          } | ConvertTo-Json | Set-Content (Join-Path $evidence "environment.json")

      - name: 检出旧版
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LEGACY_SHA }}
          path: legacy
          persist-credentials: false

      - name: 检出候选
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: 安装 Rust 工具链并核对源码
        working-directory: candidate
        run: |
          $legacy = git -C ../legacy rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $legacy -ne $env:LEGACY_SHA) { throw "Unexpected legacy commit: $legacy" }
          $candidate = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $candidate -ne $env:CANDIDATE_SHA) { throw "Unexpected candidate commit: $candidate" }
          $PSNativeCommandUseErrorActionPreference = $false
          rustup toolchain install 2>&1 | Tee-Object (Join-Path $env:EVIDENCE_DIR "rustup.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacyRust = git -C ../legacy show HEAD:rust-toolchain.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateRust = Get-Content rust-toolchain.toml
          if (Compare-Object -ReferenceObject $legacyRust -DifferenceObject $candidateRust -SyncWindow 0) {
            throw "The two pinned sources declare different Rust toolchains"
          }
          rustc -vV | Tee-Object (Join-Path $env:EVIDENCE_DIR "rustc.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version | Tee-Object (Join-Path $env:EVIDENCE_DIR "cargo-version.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            legacyCommit = $legacy
            candidateCommit = $candidate
            legacyLockSha256 = (Get-FileHash ../legacy/Cargo.lock).Hash.ToLowerInvariant()
            candidateLockSha256 = (Get-FileHash Cargo.lock).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_DIR "sources.json")

      - name: 构建旧 Host 并保存二进制
        id: legacy
        working-directory: legacy
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked --target $env:TARGET -p serial-workbench-host --bin serial-workbench-host 2>&1 |
            Tee-Object (Join-Path $env:EVIDENCE_DIR "legacy-build.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:FIXTURE_ROOT "legacy-host"
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $binary = Join-Path $fixture "serial-workbench-host.exe"
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "$env:TARGET/debug/serial-workbench-host.exe") -Destination $binary
          "SWB_TEST_UPDATER_LEGACY_HOST_BIN=$binary" >> $env:GITHUB_ENV
          (Get-FileHash -LiteralPath $binary).Hash.ToLowerInvariant() |
            Set-Content (Join-Path $env:EVIDENCE_DIR "legacy-host.sha256")

      - name: 构建候选 Host 并保存二进制
        id: candidate
        working-directory: candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked --target $env:TARGET -p serial-workbench-host --bin serial-workbench-host 2>&1 |
            Tee-Object (Join-Path $env:EVIDENCE_DIR "candidate-build.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:FIXTURE_ROOT "candidate-host"
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $binary = Join-Path $fixture "serial-workbench-host.exe"
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "$env:TARGET/debug/serial-workbench-host.exe") -Destination $binary
          "SWB_TEST_UPDATER_CURRENT_HOST_BIN=$binary" >> $env:GITHUB_ENV
          (Get-FileHash -LiteralPath $binary).Hash.ToLowerInvariant() |
            Set-Content (Join-Path $env:EVIDENCE_DIR "candidate-host.sha256")

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: candidate/.nvmrc
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: candidate/package.json

      - name: 使用冻结依赖构建候选前端
        id: frontend
        working-directory: candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm install --frozen-lockfile 2>&1 | Tee-Object (Join-Path $env:EVIDENCE_DIR "pnpm-install.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vite build 2>&1 | Tee-Object (Join-Path $env:EVIDENCE_DIR "frontend-build.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证真实两版本 Host 自动恢复
        id: recovery
        working-directory: candidate
        run: |
          [Environment]::SetEnvironmentVariable("SWB_TEST_UPDATER_MANUAL_HOST_START", $null, "Process")
          $test = "updater::host::tests::desktop_install_recovers_through_current_host_after_legacy_shutdown"
          $log = Join-Path $env:EVIDENCE_DIR "automatic-recovery.log"
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --target $env:TARGET -p serial-workbench --lib $test -- --exact --ignored --nocapture --test-threads=1 2>&1 |
            Tee-Object $log
          $exitCode = $LASTEXITCODE
          $marker = Select-String -LiteralPath $log -Pattern 'windows_legacy_update startup=automatic old_epoch=[0-9]+ recovered_epoch=[0-9]+ current_host_settled=true'
          $onePassed = Select-String -LiteralPath $log -Pattern 'test result: ok\. 1 passed; 0 failed;'
          [ordered]@{
            test = $test
            mode = "automatic"
            cargoExitCode = $exitCode
            oneTestPassed = [bool]$onePassed
            receipt = @($marker | ForEach-Object { $_.Matches.Value })
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_DIR "recovery-result.json")
          if ($exitCode -ne 0) { exit $exitCode }
          if (@($marker).Count -ne 1 -or -not $onePassed) { throw "No complete automatic-recovery receipt" }

      - name: 记录实际步骤结论
        if: always()
        env:
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          [ordered]@{
            legacyBuild = $env:LEGACY_OUTCOME
            candidateBuild = $env:CANDIDATE_OUTCOME
            frontend = $env:FRONTEND_OUTCOME
            automaticRecovery = $env:RECOVERY_OUTCOME
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_DIR "step-outcomes.json")

      - name: 保留自动恢复验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-updater-automatic-recovery
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
