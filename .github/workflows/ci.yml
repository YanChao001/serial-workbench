name: 里程碑检查
run-name: ${{ inputs.native_preflight && format('原生预检 {0}', inputs.native_preflight_target || 'x86_64-unknown-linux-gnu') || '完整四目标检查' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      desktop_e2e:
        description: 在独立 runner 执行四目标真实桌面 E2E
        type: boolean
        default: true
        required: true
      native_preflight:
        description: 仅执行所选目标的原生全场景预检，不作为里程碑验收
        type: boolean
        default: false
        required: true
      native_preflight_target:
        description: 原生预检目标；完整四目标模式不使用此选项
        type: choice
        default: x86_64-unknown-linux-gnu
        options:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.native_preflight && format('preflight-{0}', inputs.native_preflight_target || 'x86_64-unknown-linux-gnu') || 'full' }}
  cancel-in-progress: false

jobs:
  frontend:
    if: ${{ !inputs.native_preflight }}
    name: 前端校验
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本由 package.json 的 packageManager 字段统一维护
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端与工程综合检查
        run: pnpm verify

      - name: 保留综合检查失败日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-verification-logs
          path: .cache/verify
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    if: ${{ !inputs.native_preflight }}
    name: 浏览器生产构建冒烟与无障碍
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - run: pnpm install --frozen-lockfile
      - name: 构建本次浏览器预览
        run: pnpm build:web
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
      - name: 保留浏览器截图与失败 trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: artifacts/browser
          if-no-files-found: ignore

  rust:
    if: ${{ !inputs.native_preflight }}
    name: Rust 校验（${{ matrix.platform }}）
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # 无 GUI 的契约与功能检查不需要调试符号，减小链接与缓存开销。
      # 桌面 E2E 保留其调试信息，失败时仍可读取原生线程栈。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # 链接最低目标为 macOS 14；runner 实际运行 macOS 15。
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      # 保留其他平台的执行结果，分别定位平台问题
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh rust

      # tauri::generate_context! 会在编译期读取前端产物，必须先构建 dist
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json

      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # 读取 rust-toolchain.toml，工具链与组件只维护一处。
      - name: 安装 Rust 工具链
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: native-${{ matrix.target }}
          cache-on-failure: true

      # 格式规则与平台无关，仅在一个平台执行
      - name: 格式检查
        if: matrix.platform == 'windows-2022'
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 构建 Host 与真实适配器测试入口
        run: cargo build --locked -p serial-workbench-host -p serial-workbench-cli -p serial-workbench-mcp --bins

      - name: 单元测试
        # 收集全部测试程序的失败；任一失败仍使该步骤失败。
        run: cargo test --locked --workspace --no-fail-fast

      - name: 保留失败 Rust 场景现场
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-failures-${{ matrix.target }}
          path: artifacts/rust-failures
          if-no-files-found: ignore
          retention-days: 7

      - name: 构建 Ubuntu 正式软件场景入口
        if: runner.os == 'Linux'
        run: cargo build --locked -p serial-workbench-host --example software_scenarios

      - name: Ubuntu 离线六场景与 600 秒负载
        id: host-offline
        if: runner.os == 'Linux'
        run: node scripts/test-host-offline.mjs --harness src-tauri/target/debug/examples/software_scenarios --output artifacts/host-offline --duration-seconds 600

      - name: 保留 Ubuntu 离线软件场景证据
        if: always() && runner.os == 'Linux' && (steps.host-offline.outcome == 'success' || steps.host-offline.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-offline-x86_64-unknown-linux-gnu
          path: artifacts/host-offline
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: 构建未签名原生程序（不打包、不发布）
        run: pnpm app:build --no-bundle --target ${{ matrix.target }} --optimize speed

  bindings:
    if: ${{ !inputs.native_preflight }}
    name: IPC 绑定校验
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Linux 系统依赖
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh rust
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: 安装 Rust 工具链
        run: rustup toolchain install
      # 独立 job 使用自己的 runner、target 和缓存，与四目标 Rust 校验并行。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: bindings-linux-x64
          cache-on-failure: true
      - name: 验证 Rust 生成的 Host 契约与 IPC 类型
        run: |
          pnpm contracts:check
          pnpm bindings:check

  native-preflight:
    if: inputs.native_preflight
    name: 原生全场景预检（${{ inputs.native_preflight_target || 'x86_64-unknown-linux-gnu' }}）
    uses: ./.github/workflows/native-e2e.yml
    with:
      platform: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-22.04","x86_64-pc-windows-msvc":"windows-2022","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[inputs.native_preflight_target || 'x86_64-unknown-linux-gnu'] }}
      target: ${{ inputs.native_preflight_target || 'x86_64-unknown-linux-gnu' }}

  desktop-e2e:
    if: inputs.desktop_e2e && !inputs.native_preflight
    name: 真实桌面 E2E（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/native-e2e.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}

  quality-gate:
    name: ${{ inputs.native_preflight && '原生预检结果（非里程碑验收）' || '质量门禁' }}
    if: always()
    needs:
      [frontend, browser-smoke, rust, bindings, desktop-e2e, native-preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 确认所有检查通过
        if: ${{ !inputs.native_preflight }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: node scripts/ci-quality-gate.mjs
      - name: 确认原生预检结果
        if: inputs.native_preflight
        env:
          NATIVE_PREFLIGHT_RESULT: ${{ needs.native-preflight.result }}
        run: node --input-type=module -e "if (process.env.NATIVE_PREFLIGHT_RESULT !== 'success') process.exit(1)"
      - name: 记录预检范围
        if: inputs.native_preflight
        env:
          CHECKED_SHA: ${{ github.sha }}
          CHECKED_TARGET: ${{ inputs.native_preflight_target || 'x86_64-unknown-linux-gnu' }}
        run: |
          echo "Native preflight only: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Native target: $CHECKED_TARGET. This result is not milestone acceptance; run the complete four-target mode before merging." >> "$GITHUB_STEP_SUMMARY"
      - name: 记录检查基线与范围
        if: ${{ !inputs.native_preflight }}
        env:
          CHECKED_SHA: ${{ github.sha }}
          DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: |
          echo "Checked commit: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop E2E requested: $DESKTOP_E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "Targets: Windows x64 / Ubuntu 22.04 x64 / macOS 15 arm64 + x64 (deployment target 14.0)." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: checks and unsigned no-bundle builds. Hardware, macOS 14 runtime, installers, signing and 72h soak require their own acceptance." >> "$GITHUB_STEP_SUMMARY"
