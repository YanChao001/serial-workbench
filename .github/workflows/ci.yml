name: 里程碑检查
run-name: ${{ inputs.runtime_preflight && format('运行时预检 {0} / {1}', inputs.runtime_preflight_target || 'all', inputs.runtime_preflight_suite || 'all') || inputs.native_preflight && format('原生预检 {0}', inputs.native_preflight_target || 'x86_64-unknown-linux-gnu') || '完整四目标检查' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      desktop_e2e:
        description: 执行四目标真实桌面 E2E。Windows 原生预检关闭此项时只跑签名参考包场景
        type: boolean
        default: true
        required: true
      desktop_chart:
        description: 完整检查时在同一个 Windows 桌面作业补跑签名图表
        type: boolean
        default: false
      native_preflight:
        description: 仅执行所选目标的原生全场景预检，不作为里程碑验收
        type: boolean
        default: false
        required: true
      runtime_preflight:
        description: 定向验证固定运行时或离线安装，不作为里程碑验收
        type: boolean
        default: false
        required: true
      runtime_preflight_target:
        description: 运行时预检目标；all 执行四目标，不启动桌面
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        required: true
      runtime_preflight_suite:
        description: 运行时预检范围；定向套件须选择单一目标
        type: choice
        default: all
        options:
          - all
          - host-ipc
          - macos-signature
          - windows-nsis-stage
          - windows-nsis-switch
          - windows-nsis-desktop-update
          - windows-nsis-wire-v1
          - linux-offline-installer
          - macos-offline-installer
        required: true
      native_preflight_target:
        description: 原生预检目标。macos 执行两种架构，linux-desktop 同时执行 X11 原生与 KDE Wayland 热键场景
        type: choice
        default: x86_64-unknown-linux-gnu
        options:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - macos
          - windows-and-macos
          - linux-desktop
          - macos-input
          - wayland-global-send
        required: true
      native_preflight_chart:
        description: 原生预检只运行签名图表和实际窗口场景
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.runtime_preflight && format('runtime-{0}-{1}', inputs.runtime_preflight_target || 'all', inputs.runtime_preflight_suite || 'all') || inputs.native_preflight && format('preflight-{0}', inputs.native_preflight_target || 'x86_64-unknown-linux-gnu') || 'full' }}
  cancel-in-progress: false

jobs:
  frontend:
    if: ${{ !inputs.native_preflight && !inputs.runtime_preflight }}
    name: 前端校验
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本由 package.json 的 packageManager 字段统一维护
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端与工程综合检查
        run: pnpm verify

      - name: 保留综合检查失败日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-verification-logs
          path: .cache/verify
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    if: ${{ !inputs.native_preflight && !inputs.runtime_preflight }}
    name: 浏览器生产构建冒烟与无障碍
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - run: pnpm install --frozen-lockfile
      - name: 构建本次浏览器预览
        run: pnpm build:web
      - name: 准备浏览器依赖与运行时
        run: |
          source scripts/ci-linux-deps.sh
          prepare_linux_index
          pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
      - name: 保留浏览器截图与失败 trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: artifacts/browser
          if-no-files-found: ignore

  rust:
    needs: linux-node-backend
    if: ${{ !cancelled() && !inputs.native_preflight && !inputs.runtime_preflight }}
    name: Rust 校验（${{ matrix.platform }}）
    runs-on: ${{ matrix.platform }}
    # Intel macOS 冷缓存编译约 46 分钟，完整 runtime 场景另需约 21 分钟。
    timeout-minutes: ${{ matrix.platform == 'macos-15-intel' && 90 || 60 }}
    env:
      # 无 GUI 的契约与功能检查不需要调试符号，减小链接与缓存开销。
      # 桌面 E2E 保留其调试信息，失败时仍可读取原生线程栈。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # 链接最低目标为 macOS 14；runner 实际运行 macOS 15。
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      # 保留其他平台的执行结果，分别定位平台问题
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh rust

      # tauri::generate_context! 会在编译期读取前端产物，必须先构建 dist
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json

      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # 读取 rust-toolchain.toml，工具链与组件只维护一处。
      - name: 安装 Rust 工具链
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: native-${{ matrix.target }}
          cache-on-failure: true

      # 格式规则与平台无关，仅在一个平台执行
      - name: 格式检查
        if: matrix.platform == 'windows-2022'
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 单元测试
        # 保留全部测试程序的结果。后续步骤复用本次编译的三个伴随程序及 software_scenarios。
        run: cargo test --locked --workspace --no-fail-fast

      - name: 独立读取真实脱敏录制卷
        shell: bash
        run: |
          export SWB_TEST_CAPTURE_NODE_BIN="$(node -p 'process.execPath')"
          cargo test --locked -p serial-workbench-host --test capture_api_host \
            redacted_host_archive_passes_independent_readback -- --ignored --exact --test-threads=1

      - name: 验证离线 CLI 自有 Host 和录制分页
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export SWB_TEST_HEADLESS_HOST_BIN="$PWD/src-tauri/target/debug/serial-workbench-host$suffix"
          export SWB_TEST_CLI_BIN="$PWD/src-tauri/target/debug/serial-workbench-cli$suffix"
          cargo test --locked -p serial-workbench-cli --test commands headless_offline_ -- --ignored --test-threads=1
          cargo test --locked -p serial-workbench-host --test capture_api_host cli_batch_replay_search_ -- --ignored --test-threads=1

      - name: 验证双栈 LAN 停用与恢复
        shell: bash
        timeout-minutes: 6
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          binaries="$PWD/src-tauri/target/debug"
          mkdir -p artifacts/rust-failures
          evidence="$(node -p 'require("node:fs").mkdtempSync("artifacts/rust-failures/lan-route-")')"
          node e2e/lan-route.mjs "$binaries/serial-workbench-host$suffix" \
            "$binaries/serial-workbench-cli$suffix" "$binaries/serial-workbench-mcp$suffix" \
            "$evidence/run" --loopback-roles

      - name: 保留失败 Rust 场景现场
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-failures-${{ matrix.target }}
          path: artifacts/rust-failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Ubuntu 离线六场景与 600 秒负载
        id: host-offline
        if: runner.os == 'Linux'
        run: node scripts/test-host-offline.mjs --harness src-tauri/target/debug/examples/software_scenarios --output artifacts/host-offline --duration-seconds 600

      - name: 保留 Ubuntu 离线软件场景证据
        if: always() && runner.os == 'Linux' && (steps.host-offline.outcome == 'success' || steps.host-offline.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-offline-x86_64-unknown-linux-gnu
          path: artifacts/host-offline
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: 准备 macOS 发行来源验签工具
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: |
          if ! command -v gpgv >/dev/null 2>&1; then brew install gnupg; fi
          gpgv --version

      - name: 核对本次 Ubuntu 固定源码产物的 ID
        if: runner.os == 'Linux'
        shell: bash
        env:
          SOURCE_ARTIFACT_ID: ${{ needs.linux-node-backend.outputs.source-artifact-id }}
        run: |
          if [[ ! "$SOURCE_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "The signed Linux runtime job did not publish a source archive artifact" >&2
            exit 1
          fi

      - name: 下载本次验签的 Ubuntu 固定源码
        if: runner.os == 'Linux'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.linux-node-backend.outputs.source-artifact-id }}
          path: .cache/node-runtime/sources

      - name: 构建未签名原生程序（不打包、不发布）
        run: pnpm app:build --no-bundle --target ${{ matrix.target }} --optimize speed

      - name: 构建 runtime 探针与参考包签名工具
        shell: bash
        run: |
          unset SWB_NODE_RUNTIME_BUILD_IMAGE
          binding="$PWD/src-tauri/target/${{ matrix.target }}/release/runtime/node-image.json"
          if [[ "$RUNNER_OS" == "macOS" ]]; then export SWB_NODE_RUNTIME_BUILD_IMAGE="$binding"; fi
          cargo build --locked -p serial-workbench-host \
            --example node_runtime_probe --example sign_reference_terminal \
            --example sign_reference_chart --example sign_reference_automation --example sign_reference_mdf4

      - name: 准备 Windows 签名浏览器验收
        if: runner.os == 'Windows'
        run: pnpm exec playwright install --only-shell chromium

      - name: 验证原生 runtime 安装布局与故障
        id: node-runtime
        shell: bash
        env:
          SWB_NODE_RUNTIME_TEST_ROOT: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release
        run: |
          unset SWB_NODE_RUNTIME_BUILD_IMAGE
          binding="$PWD/src-tauri/target/${{ matrix.target }}/release/runtime/node-image.json"
          if [[ "$RUNNER_OS" == "macOS" ]]; then export SWB_NODE_RUNTIME_BUILD_IMAGE="$binding"; fi
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          pnpm test:runtime --target '${{ matrix.target }}' --resources 'src-tauri/target/${{ matrix.target }}/release' --probe "src-tauri/target/debug/examples/node_runtime_probe$suffix" --output artifacts/node-runtime
          cargo test --locked -p serial-workbench-host --test node_runtime -- --include-ignored --test-threads=1
          if [[ "$RUNNER_OS" != "Linux" ]]; then
            cargo test --locked -p serial-workbench-host --test node_packages verified_backend_ -- --ignored --test-threads=1 --nocapture
          fi
          export SWB_TEST_CLI_BIN="$PWD/src-tauri/target/debug/serial-workbench-cli$suffix"
          export SWB_TEST_MCP_BIN="$PWD/src-tauri/target/debug/serial-workbench-mcp$suffix"
          cargo test --locked -p serial-workbench-host --lib native_node_ -- --ignored --test-threads=1 --nocapture
          pnpm plugin-sdk:fixture
          export SWB_TEST_NODE_SDK_FIXTURE="$PWD/.cache/plugin-sdk/examples/native-parity.js"
          cargo test --locked -p serial-workbench-host --test client_parity native_node_dynamic_ -- --ignored --test-threads=1 --nocapture
          if [[ "$RUNNER_OS" == "macOS" ]]; then cargo test --locked -p serial-workbench-host --lib native_macos_ -- --ignored --test-threads=1; fi
          mkdir -p artifacts/reference-terminal artifacts/reference-chart artifacts/reference-automation artifacts/reference-mdf4
          seed="artifacts/test-reference-package.seed"
          node -e 'require("node:fs").writeFileSync(process.argv[1], require("node:crypto").randomBytes(32), { flag: "wx", mode: 0o600 })' "$seed"
          trap 'rm -f -- "$seed"' EXIT
          for reference in terminal chart automation mdf4; do
            output="$(node -p 'require("node:path").resolve(process.argv[1])' "artifacts/reference-$reference")"
            "src-tauri/target/debug/examples/sign_reference_${reference}$suffix" \
              ".cache/plugin-sdk/examples/reference-$reference/main.js" "$seed" \
              "$output/reference-$reference.zip" "$reference-reference" ci-acceptance \
              > "artifacts/reference-$reference/signed-$reference.json"
          done
          rm -- "$seed"
          trap - EXIT
          export SWB_TEST_SIGNED_TERMINAL_RECEIPT="$(node -p 'require("node:path").resolve("artifacts/reference-terminal/signed-terminal.json")')"
          export SWB_TEST_SIGNED_CHART_RECEIPT="$(node -p 'require("node:path").resolve("artifacts/reference-chart/signed-chart.json")')"
          export SWB_TEST_SIGNED_AUTOMATION_RECEIPT="$(node -p 'require("node:path").resolve("artifacts/reference-automation/signed-automation.json")')"
          export SWB_TEST_SIGNED_MDF4_RECEIPT="$(node -p 'require("node:path").resolve("artifacts/reference-mdf4/signed-mdf4.json")')"
          export SWB_TEST_MDF4_RESULT="$(node -p 'require("node:path").resolve("artifacts/reference-mdf4/native-roundtrip.mf4")')"
          installed="$PWD/src-tauri/target/${{ matrix.target }}/release"
          export SWB_TEST_TERMINAL_HOST_BIN="$installed/serial-workbench-host$suffix"
          export SWB_TEST_CLI_BIN="$installed/serial-workbench-cli$suffix"
          export SWB_TEST_MCP_BIN="$installed/serial-workbench-mcp$suffix"
          cargo test --locked -p serial-workbench --lib native_reference_terminal_ -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-terminal/native-reader.log
          cargo test --locked -p serial-workbench --lib native_chart_samples_exact_rx_from_the_signed_reference_package -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-chart/native-samples.log
          cargo test --locked -p serial-workbench --lib native_mdf4_saved_bytes_match_the_signed_mcp_export -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-mdf4/native-roundtrip.log
          cargo test --locked -p serial-workbench --lib native_automation_uses_exact_responses_and_keeps_capture_running -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-automation/native-response.log
          cargo test --locked -p serial-workbench --lib native_automation_modbus_matches_owned_tx_and_reports_a_late_exception -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-automation/native-modbus.log
          cargo test --locked -p serial-workbench --lib native_automation_long_script_survives_caller_disconnect_and_settles_workers -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee artifacts/reference-automation/native-long-script.log
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export SWB_TEST_BROWSER_ASSETS="$(node -p 'require("node:path").resolve("dist")')"
            export SWB_TEST_BROWSER_NODE_BIN="$(node -p 'process.execPath')"
            export SWB_TEST_BROWSER_TERMINAL_OUTPUT="$(node -p 'require("node:path").resolve("artifacts/reference-terminal/paired-browser")')"
            cargo test --locked -p serial-workbench-host --test browser_pairing paired_chromium_opens_and_retires_a_signed_terminal_view -- --ignored --test-threads=1 --nocapture 2>&1 \
              | tee artifacts/reference-terminal/paired-browser.log
            export SWB_TEST_BROWSER_CHART_OUTPUT="$(node -p 'require("node:path").resolve("artifacts/reference-chart/paired-browser")')"
            cargo test --locked -p serial-workbench-host --test browser_pairing paired_chromium_reads_and_retires_a_signed_chart_view -- --ignored --test-threads=1 --nocapture 2>&1 \
              | tee artifacts/reference-chart/paired-browser.log
          fi

      - name: 验证真实配对浏览器工作台
        id: paired-workbench-files
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 8
        run: |
          pnpm build:web
          output="$(cygpath -am "$RUNNER_TEMP")/paired-workbench"
          mkdir -p "$output"
          export SWB_TEST_BROWSER_TRANSFER_OUTPUT="$output/transfer"
          if ! cargo test --locked -p serial-workbench-host --test browser_pairing \
              browser_file_upload_sends_the_selected_range_once_and_returns_quota_after_revocation \
              -- --test-threads=1 > "$output/transfer.log" 2>&1; then
            echo "::error::真实配对浏览器文件交接测试进程失败。"
            exit 1
          fi
          if ! test -s "$output/transfer/browser-transfer-receipt.json"; then
            echo "::error::真实配对浏览器文件交接收据缺失。"
            exit 1
          fi
          export SWB_TEST_EXPERIMENT_BROWSER_OUTPUT="$output/experiment"
          if ! cargo test --locked -p serial-workbench-host --test capture_api_host \
              paired_browsers_exchange_experiment_between_two_hosts \
              -- --ignored --test-threads=1 > "$output/experiment.log" 2>&1; then
            echo "::error::真实配对浏览器实验包交换测试进程失败。"
            exit 1
          fi
          if ! test -s "$output/experiment/host-receipt.json"; then
            echo "::error::真实配对浏览器实验包交换收据缺失。"
            exit 1
          fi

          export SWB_NODE_RUNTIME_TEST_ROOT="$(cygpath -am "src-tauri/target/${{ matrix.target }}/release")"
          export SWB_TEST_MAPPED_CAPTURE_OUTPUT="$output/mapped-capture"
          if ! cargo test --locked -p serial-workbench-host --test capture_api_host \
              paired_browser_maps_signed_tcp_bytes_and_keeps_raw_recording_and_receipts \
              -- --ignored --test-threads=1 > "$output/mapped-capture.log" 2>&1; then
            echo "::error::真实配对浏览器字符映射录制测试进程失败。"
            exit 1
          fi
          if ! test -s "$output/mapped-capture/host-receipt.json" || ! test -s "$output/mapped-capture/browser-receipt.json"; then
            echo "::error::真实配对浏览器字符映射录制收据缺失。"
            exit 1
          fi

          export SWB_TEST_HOLD_SEND_OUTPUT="$output/hold-send"
          if ! cargo test --locked -p serial-workbench-host --test capture_api_host \
              paired_browser_held_send_settles_two_writes_and_stops_on_release \
              -- --ignored --test-threads=1 > "$output/hold-send.log" 2>&1; then
            echo "::error::真实配对浏览器按住连发测试进程失败。"
            exit 1
          fi
          if ! test -s "$output/hold-send/host-receipt.json" || ! test -s "$output/hold-send/browser-receipt.json"; then
            echo "::error::真实配对浏览器按住连发收据缺失。"
            exit 1
          fi

      - name: 保留 runtime 验收收据与原始输出
        if: always() && (steps.node-runtime.outcome == 'success' || steps.node-runtime.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-runtime-${{ matrix.target }}
          path: |
            artifacts/node-runtime/**/suite.json
            artifacts/node-runtime/**/failure.json
            artifacts/node-runtime/**/receipt.json
            artifacts/node-runtime/**/command.stdout
            artifacts/node-runtime/**/command.stderr
            .cache/node-runtime/layouts/**/runtime-preparation.json
            .cache/node-runtime/layouts/**/node-resigning.json
            .cache/node-runtime/layouts/**/node-sign*.stdout
            .cache/node-runtime/layouts/**/node-sign*.stderr
            .cache/node-runtime/layouts/**/resources/runtime/node-image.json
            artifacts/node-runtime/**/command-error.txt
            artifacts/node-runtime/**/probe.stdout
            artifacts/node-runtime/**/probe.stderr
            artifacts/node-runtime/**/probe-io.txt
            artifacts/reference-terminal/reference-terminal.zip
            artifacts/reference-terminal/signed-terminal.json
            artifacts/reference-terminal/native-reader.log
            artifacts/reference-terminal/paired-browser.log
            artifacts/reference-terminal/paired-browser/**
            artifacts/reference-chart/reference-chart.zip
            artifacts/reference-chart/signed-chart.json
            artifacts/reference-chart/native-samples.log
            artifacts/reference-chart/paired-browser.log
            artifacts/reference-chart/paired-browser/**
            artifacts/reference-automation/reference-automation.zip
            artifacts/reference-automation/signed-automation.json
            artifacts/reference-automation/native-response.log
            artifacts/reference-automation/native-modbus.log
            artifacts/reference-automation/native-long-script.log
            artifacts/reference-mdf4/reference-mdf4.zip
            artifacts/reference-mdf4/signed-mdf4.json
            artifacts/reference-mdf4/native-roundtrip.log
            artifacts/reference-mdf4/native-roundtrip.mf4
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: 保留 runtime 失败夹具与来源现场
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-runtime-failures-${{ matrix.target }}
          path: |
            artifacts/node-runtime
            .cache/node-runtime
            artifacts/rust-failures/node-runtime-*/**
            artifacts/rust-failures/node-backend-*/**
            artifacts/rust-failures/host-node-backend-*/**
            artifacts/rust-failures/host-node-task-derived-*/derived.events
            artifacts/rust-failures/macos-node-before-auth-*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  linux-node-backend:
    if: ${{ !inputs.native_preflight && !inputs.runtime_preflight }}
    name: Linux x64 签名插件后台
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      source-artifact-id: ${{ steps.linux-source-artifact.outputs.artifact-id }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUNTIME_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 安装 Rust 工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: node-backend-${{ env.RUNTIME_TARGET }}
          cache-on-failure: true
      - name: 恢复已完整下载的 Ubuntu 固定源码
        id: linux-runtime-sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/node-runtime/sources/*/*.tar.xz
            .cache/node-runtime/sources/*/*.tar.gz
            .cache/node-runtime/sources/*/*.dsc
            .cache/node-runtime/sources/*/*.deb
          key: swb-linux-runtime-sources-${{ hashFiles('resources/runtime/node-release.json', 'resources/runtime/libatomic-jammy.json', 'resources/runtime/SHASUMS256.txt.asc', 'resources/runtime/ubuntu-jammy-InRelease.asc') }}
      - name: 验签并准备固定原生运行时
        run: node scripts/ci-prepare-node-runtime.mjs
      - name: 交付本次验签的 Ubuntu 固定源码
        id: linux-source-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runtime-sources-${{ github.run_attempt }}
          path: |
            .cache/node-runtime/sources/*/*.tar.xz
            .cache/node-runtime/sources/*/*.tar.gz
            .cache/node-runtime/sources/*/*.dsc
            .cache/node-runtime/sources/*/*.deb
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 保存验签通过的 Ubuntu 固定源码
        if: steps.linux-runtime-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/node-runtime/sources/*/*.tar.xz
            .cache/node-runtime/sources/*/*.tar.gz
            .cache/node-runtime/sources/*/*.dsc
            .cache/node-runtime/sources/*/*.deb
          key: ${{ steps.linux-runtime-sources.outputs.cache-primary-key }}
      - name: 验证签名插件后台
        shell: bash
        run: |
          mkdir -p artifacts/linux-node-backend
          echo "source=$GITHUB_SHA target=$RUNTIME_TARGET" | tee artifacts/linux-node-backend/results.log
          cargo test --locked -p serial-workbench-host --test node_packages verified_backend_ -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee -a artifacts/linux-node-backend/results.log
      - name: 保留测试输出与运行时来源
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-node-backend-x64
          path: |
            artifacts/linux-node-backend/results.log
            .cache/node-runtime/layouts/**/runtime-preparation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保留失败夹具
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-node-backend-failures-x64
          path: |
            artifacts/rust-failures/node-backend-*/**
            artifacts/rust-failures/host-node-backend-*/**
          if-no-files-found: ignore
          retention-days: 7

  bindings:
    if: ${{ !inputs.native_preflight && !inputs.runtime_preflight }}
    name: IPC 绑定校验
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Linux 系统依赖
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh rust
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: 安装 Rust 工具链
        run: rustup toolchain install
      # 独立 job 使用自己的 runner、target 和缓存，与四目标 Rust 校验并行。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: bindings-linux-x64
          cache-on-failure: true
      - name: 验证 Rust 生成的 Host 契约与 IPC 类型
        run: |
          pnpm contracts:check
          pnpm bindings:check

  runtime-preflight:
    if: inputs.runtime_preflight
    name: 运行时预检（非里程碑验收）
    uses: ./.github/workflows/runtime-preflight.yml
    with:
      target: ${{ inputs.runtime_preflight_target || 'all' }}
      suite: ${{ inputs.runtime_preflight_suite || 'all' }}
      conflicting_preflight: ${{ inputs.native_preflight }}

  native-preflight:
    if: inputs.native_preflight && !inputs.runtime_preflight && inputs.native_preflight_target != 'macos-input' && inputs.native_preflight_target != 'wayland-global-send'
    name: 原生全场景预检（${{ matrix.target }}）
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON('{"macos":["aarch64-apple-darwin","x86_64-apple-darwin"],"windows-and-macos":["x86_64-pc-windows-msvc","aarch64-apple-darwin","x86_64-apple-darwin"],"linux-desktop":["x86_64-unknown-linux-gnu"]}')[inputs.native_preflight_target]
            || fromJSON(format('["{0}"]', inputs.native_preflight_target || 'x86_64-unknown-linux-gnu')) }}
    uses: ./.github/workflows/native-e2e.yml
    with:
      platform: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-22.04","x86_64-pc-windows-msvc":"windows-2022","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel"}')[matrix.target] }}
      target: ${{ matrix.target }}
      native_file_dialogs: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
      chart_only: ${{ inputs.native_preflight_chart && inputs.native_preflight_target != 'linux-desktop' }}
      windows_reference_only: ${{ matrix.target == 'x86_64-pc-windows-msvc' && !inputs.desktop_e2e }}

  macos-input-preflight:
    if: inputs.native_preflight && !inputs.runtime_preflight && inputs.native_preflight_target == 'macos-input'
    name: macOS 系统热键探针（${{ matrix.platform }}）
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 验证登录会话的功能键回调
        shell: bash
        run: |
          helper="$RUNNER_TEMP/serial-workbench-global-send"
          bash e2e/build-macos-global-send.sh "$helper"
          node e2e/macos-global-send-probe.mjs "$helper" "$RUNNER_TEMP/macos-hotkey-input"
      - name: 保留系统热键证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: macos-hotkey-input-${{ matrix.platform }}
          path: ${{ runner.temp }}/macos-hotkey-input
          if-no-files-found: ignore

  wayland-global-send-preflight:
    if: inputs.native_preflight && !inputs.runtime_preflight && (inputs.native_preflight_target == 'wayland-global-send' || inputs.native_preflight_target == 'linux-desktop')
    name: KDE Wayland 全局发送预检
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装隔离 Wayland 会话与构建依赖
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh wayland
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - name: 安装依赖与 Rust 工具链
        run: |
          pnpm install --frozen-lockfile
          rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target/e2e
          key: e2e-wayland-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: 构建测试专用桌面应用
        id: wayland-app
        run: pnpm e2e:build
      - name: 验证 v2 系统分配、系统改键与跨应用发送
        timeout-minutes: 5
        run: bash e2e/run-wayland.sh
      - name: 验证 v1 手动设置、跨应用发送和释放
        if: ${{ !cancelled() && steps.wayland-app.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          portal_dir="$RUNNER_TEMP/wayland-portal-v1"
          mkdir -p "$portal_dir"
          archive="$portal_dir/xdg-desktop-portal-1.20.4.tar.xz"
          curl --fail --location --silent --show-error --max-time 45 --output "$archive" \
            https://github.com/flatpak/xdg-desktop-portal/releases/download/1.20.4/xdg-desktop-portal-1.20.4.tar.xz
          printf '%s  %s\n' 9528eb3b060b88ac82f294fbdc6af5f4d3adfa42575f2cd816cab3d3e0a7a68c "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$portal_dir"
          meson setup "$portal_dir/build" "$portal_dir/xdg-desktop-portal-1.20.4" \
            --prefix=/usr --wrap-mode=nodownload -Dtests=disabled -Ddocumentation=disabled \
            -Dman-pages=disabled -Dflatpak-interfaces=disabled
          meson compile -C "$portal_dir/build" xdg-desktop-portal
          bash e2e/run-wayland.sh --portal-v1 "$portal_dir/build/src/xdg-desktop-portal"
      - name: 保留 Wayland 原生证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wayland-global-send
          path: |
            artifacts/e2e/wayland
            artifacts/e2e/wayland-v1
          if-no-files-found: ignore

  desktop-e2e:
    if: inputs.desktop_e2e && !inputs.native_preflight && !inputs.runtime_preflight
    name: 真实桌面 E2E（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/native-e2e.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      native_file_dialogs: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
      chart_with_desktop: ${{ inputs.desktop_chart && matrix.target == 'x86_64-pc-windows-msvc' }}

  quality-gate:
    name: ${{ inputs.native_preflight && '原生预检结果（非里程碑验收）' || '质量门禁' }}
    if: always() && !inputs.runtime_preflight
    needs:
      [
        frontend,
        browser-smoke,
        rust,
        linux-node-backend,
        bindings,
        desktop-e2e,
        native-preflight,
        macos-input-preflight,
        wayland-global-send-preflight,
      ]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 确认所有检查通过
        if: ${{ !inputs.native_preflight }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: node scripts/ci-quality-gate.mjs
      - name: 确认原生预检结果
        if: inputs.native_preflight
        env:
          NATIVE_PREFLIGHT_RESULT: >-
            ${{ inputs.native_preflight_target == 'linux-desktop' && format('{0},{1}', needs.native-preflight.result, needs.wayland-global-send-preflight.result)
            || inputs.native_preflight_target == 'macos-input' && needs.macos-input-preflight.result
            || inputs.native_preflight_target == 'wayland-global-send' && needs.wayland-global-send-preflight.result
            || needs.native-preflight.result }}
        run: node --input-type=module -e "if (process.env.NATIVE_PREFLIGHT_RESULT.split(',').some(result => result !== 'success')) process.exit(1)"
      - name: 记录预检范围
        if: inputs.native_preflight
        env:
          CHECKED_SHA: ${{ github.sha }}
          CHECKED_TARGET: ${{ inputs.native_preflight_target || 'x86_64-unknown-linux-gnu' }}
        run: |
          echo "Native preflight only: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Native preflight selection: $CHECKED_TARGET. This result is not milestone acceptance; run the complete four-target mode before merging." >> "$GITHUB_STEP_SUMMARY"
      - name: 记录检查基线与范围
        if: ${{ !inputs.native_preflight }}
        env:
          CHECKED_SHA: ${{ github.sha }}
          DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: |
          echo "Checked commit: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop E2E requested: $DESKTOP_E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "Targets: Windows x64 / Ubuntu 22.04 x64 / macOS 15 arm64 + x64 (deployment target 14.0)." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: checks and unsigned no-bundle builds. Hardware, macOS 14 runtime, installers, signing and 72h soak require their own acceptance." >> "$GITHUB_STEP_SUMMARY"
