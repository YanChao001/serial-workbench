name: 里程碑检查

on:
  workflow_dispatch:
    inputs:
      desktop_e2e:
        description: 在独立 runner 执行四目标真实桌面 E2E
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: 前端校验
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本由 package.json 的 packageManager 字段统一维护
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端与工程综合检查
        run: pnpm verify

      - name: 保留综合检查失败日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-verification-logs
          path: .cache/verify
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    name: 浏览器生产构建冒烟与无障碍
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建本次浏览器预览
        run: pnpm build:web
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
      - name: 保留浏览器截图与失败 trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: artifacts/browser
          if-no-files-found: ignore

  rust:
    name: Rust 校验（${{ matrix.platform }}）
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # 无 GUI 的契约与功能检查不需要调试符号，减小链接与缓存开销。
      # 桌面 E2E 保留其调试信息，失败时仍可读取原生线程栈。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # 链接最低目标为 macOS 14；runner 实际运行 macOS 15。
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      # 保留其他平台的执行结果，分别定位平台问题
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          apt=(sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libatomic1 patchelf

      # tauri::generate_context! 会在编译期读取前端产物，必须先构建 dist
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # 读取 rust-toolchain.toml，工具链与组件只维护一处。
      - name: 安装 Rust 工具链
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: native-${{ matrix.target }}
          cache-on-failure: true

      # 格式规则与平台无关，仅在一个平台执行
      - name: 格式检查
        if: matrix.platform == 'windows-2022'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --locked --workspace

      - name: 构建未签名原生程序（不打包、不发布）
        run: pnpm app:build --no-bundle --target ${{ matrix.target }} --optimize speed

  bindings:
    name: IPC 绑定校验
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Linux 系统依赖
        timeout-minutes: 8
        run: |
          apt=(sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libatomic1 patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装前端依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: 安装 Rust 工具链
        run: rustup toolchain install
      # 独立 job 使用自己的 runner、target 和缓存，与四目标 Rust 校验并行。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: bindings-linux-x64
          cache-on-failure: true
      - name: 验证 Rust 生成的 IPC 类型
        run: pnpm bindings:check

  desktop-e2e:
    if: inputs.desktop_e2e
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    name: 真实桌面 E2E（${{ matrix.platform }}）
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          apt=(sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libatomic1 patchelf xvfb dbus-x11 openbox gdb

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖与 Rust 工具链
        run: |
          pnpm install --frozen-lockfile
          rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target/e2e
          key: e2e-${{ matrix.target }}
          # 保留已成功编译的依赖缓存，桌面断言失败后仍可复用。
          cache-on-failure: true

      # 仅 feature=e2e 带内嵌 WebDriver，使用 .e2e 标识及临时用户数据。
      - name: 构建测试专用桌面应用
        run: pnpm e2e:build

      - name: 桌面 E2E（Windows / macOS）
        if: runner.os != 'Linux'
        run: pnpm test:e2e --interactive --skip-build

      - name: 桌面 E2E（Linux）
        if: runner.os == 'Linux'
        env:
          WEBKIT_DMABUF_RENDERER_FORCE_SHM: "1"
        run: |
          mkdir -p artifacts/e2e/crash
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/artifacts/e2e/crash/core.%p"
          ulimit -c unlimited
          dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/serial-workbench-openbox.log 2>&1 & pnpm test:e2e --interactive --skip-build'

      - name: 保存 Linux 应用崩溃的原生线程栈
        if: failure() && runner.os == 'Linux'
        run: |
          if [[ ! -f src-tauri/target/e2e/build.json ]]; then
            echo "本次测试程序尚未构建，没有可读取的应用崩溃栈。"
            exit 0
          fi
          binary="$(node --input-type=module -e 'import { readE2EBuild } from "./e2e/build.mjs"; process.stdout.write(readE2EBuild());')"
          shopt -s nullglob
          found=0
          for native_log in artifacts/e2e/*/native.log; do
            pid="$(sed -n 's/.*owned-process-exit .* pid=\([0-9][0-9]*\)$/\1/p' "$native_log" | tail -n 1)"
            [[ "$pid" =~ ^[0-9]+$ ]] || continue
            core="artifacts/e2e/crash/core.$pid"
            [[ -f "$core" ]] || continue
            found=1
            backtrace="artifacts/e2e/crash/app-$pid.backtrace.txt"
            if ! timeout --kill-after=5s 60s gdb --batch --quiet "$binary" "$core" \
              -ex 'set pagination off' -ex 'info threads' -ex 'thread apply all bt' > "$backtrace" 2>&1; then
              echo "gdb 未完整结束，已保留可取得的线程栈：$backtrace"
            fi
            # 只保留文本栈；core 属于本次隔离应用且可能包含大块进程内存。
            rm -f -- "$core"
          done
          if (( found == 0 )); then
            echo "没有发现本次主程序的 core dump；保留原有进程退出记录。"
          fi

      - name: 保留失败截图与测试日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-${{ matrix.target }}
          path: |
            artifacts/e2e
            !artifacts/e2e/crash/core.*
          if-no-files-found: ignore

  quality-gate:
    name: 质量门禁
    if: always()
    needs: [frontend, browser-smoke, rust, bindings, desktop-e2e]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 确认所有检查通过
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: node scripts/ci-quality-gate.mjs
      - name: 记录检查基线与范围
        env:
          CHECKED_SHA: ${{ github.sha }}
          DESKTOP_E2E: ${{ inputs.desktop_e2e }}
        run: |
          echo "Checked commit: $CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop E2E requested: $DESKTOP_E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "Targets: Windows x64 / Ubuntu 22.04 x64 / macOS 15 arm64 + x64 (deployment target 14.0)." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: checks and unsigned no-bundle builds. Hardware, macOS 14 runtime, installers, signing and 72h soak require their own acceptance." >> "$GITHUB_STEP_SUMMARY"
