name: 固定运行时专项预检（非里程碑验收）

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      suite:
        type: string
        default: all
      conflicting_preflight:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 限定目标与互斥模式
        id: matrix
        env:
          RUNTIME_TARGET: ${{ inputs.target }}
          RUNTIME_SUITE: ${{ inputs.suite }}
          CONFLICTING_PREFLIGHT: ${{ inputs.conflicting_preflight }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { loadNodeRuntimeRelease } from './scripts/node-runtime-source.mjs';
          if (process.env.CONFLICTING_PREFLIGHT !== 'false') throw new Error('Preflight modes are mutually exclusive');
          const platforms = {
            'x86_64-unknown-linux-gnu': 'ubuntu-22.04',
            'x86_64-pc-windows-msvc': 'windows-2022',
            'aarch64-apple-darwin': 'macos-15',
            'x86_64-apple-darwin': 'macos-15-intel',
          };
          const release = loadNodeRuntimeRelease(process.cwd());
          const requested = process.env.RUNTIME_TARGET;
          if (requested !== 'all' && !Object.hasOwn(platforms, requested)) throw new Error('Unsupported runtime preflight target');
          const suite = process.env.RUNTIME_SUITE;
          if (!['all', 'host-ipc', 'macos-signature', 'windows-nsis-stage', 'linux-offline-installer', 'macos-offline-installer'].includes(suite)) throw new Error('Unsupported runtime preflight suite');
          if (suite !== 'all' && requested === 'all') throw new Error('A focused runtime preflight needs one target');
          if (suite === 'macos-signature' && !requested.endsWith('-apple-darwin')) throw new Error('The signature suite requires macOS');
          if (suite === 'windows-nsis-stage' && requested !== 'x86_64-pc-windows-msvc') throw new Error('The NSIS staging suite requires Windows x64');
          if (suite === 'linux-offline-installer' && requested !== 'x86_64-unknown-linux-gnu') throw new Error('The offline Debian installer suite requires Linux x64');
          if (suite === 'macos-offline-installer' && !requested.endsWith('-apple-darwin')) throw new Error('The offline disk image suite requires macOS');
          const include = Object.entries(platforms)
            .filter(([target]) => requested === 'all' || requested === target)
            .map(([target, platform]) => {
              if (!release.targets.some(spec => spec.target === target)) throw new Error('Runtime target is missing from pinned release');
              return { target, platform };
            });
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  runtime:
    name: 运行时预检（${{ matrix.target }}）
    needs: plan
    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ (endsWith(inputs.suite, '-offline-installer') || inputs.suite == 'windows-nsis-stage') && 50 || 25 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Rust 工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target
          key: native-${{ matrix.target }}
          cache-on-failure: true
      - name: 准备 macOS 验签工具
        if: runner.os == 'macOS'
        run: |
          if ! command -v gpgv >/dev/null 2>&1; then brew install gnupg; fi
          gpgv --version
      - name: 验签并准备固定原生运行时
        if: ${{ !endsWith(inputs.suite, '-offline-installer') && inputs.suite != 'windows-nsis-stage' }}
        run: node scripts/ci-prepare-node-runtime.mjs
      - name: 编译未签名的 NSIS 并在隔离 runner 验证暂存夹具
        if: inputs.suite == 'windows-nsis-stage'
        shell: pwsh
        run: |
          pnpm app:build --target $env:RUNTIME_TARGET --bundles nsis --optimize speed --ci --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "artifacts/$version/$env:RUNTIME_TARGET/installers"
          $installer = @(Get-ChildItem -LiteralPath "$archive/nsis" -Filter '*-setup.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected exactly one candidate NSIS installer' }
          $env:SWB_TEST_NSIS_STAGE_INSTALLER = $installer[0].FullName
          cargo build --locked -p serial-workbench --release --features bindings --bin verify-updater --target $env:RUNTIME_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWB_TEST_NSIS_STAGE_VERIFIER = (Resolve-Path -LiteralPath "src-tauri/target/$env:RUNTIME_TARGET/release/verify-updater.exe").Path
          New-Item -ItemType Directory -Path artifacts/windows-nsis-stage | Out-Null
          pnpm test:installer --interactive 2>&1 | Tee-Object -FilePath artifacts/windows-nsis-stage/installer-layout.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证 Debian 实际离线安装与参考包
        if: inputs.suite == 'linux-offline-installer'
        run: |
          bash scripts/ci-linux-deps.sh rust
          bash scripts/ci-linux-offline-installer.sh
      - name: 验证 macOS DMG 实际离线安装与参考包
        if: inputs.suite == 'macos-offline-installer'
        run: bash scripts/ci-macos-offline-installer.sh
      - name: 构建运行时探针、CLI 与 MCP
        if: inputs.suite == 'all'
        run: >-
          cargo build --locked -p serial-workbench-host -p serial-workbench-cli -p serial-workbench-mcp
          --example node_runtime_probe --bin serial-workbench-cli --bin serial-workbench-mcp
      - name: 验证原生 runtime 安装布局与故障
        if: inputs.suite == 'all'
        id: node-runtime
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          pnpm test:runtime --target "$RUNTIME_TARGET" --resources "$SWB_NODE_RUNTIME_TEST_ROOT" --probe "src-tauri/target/debug/examples/node_runtime_probe$suffix" --output artifacts/runtime-preflight
          cargo test --locked -p serial-workbench-host --test node_runtime -- --include-ignored --test-threads=1
          cargo test --locked -p serial-workbench-host --test node_packages verified_backend_ -- --ignored --test-threads=1
          export SWB_TEST_CLI_BIN="$PWD/src-tauri/target/debug/serial-workbench-cli$suffix"
          export SWB_TEST_MCP_BIN="$PWD/src-tauri/target/debug/serial-workbench-mcp$suffix"
          cargo test --locked -p serial-workbench-host --lib native_node_ -- --ignored --test-threads=1 --nocapture
          pnpm plugin-sdk:fixture
          export SWB_TEST_NODE_SDK_FIXTURE="$PWD/.cache/plugin-sdk/examples/native-parity.js"
          cargo test --locked -p serial-workbench-host --test client_parity native_node_dynamic_ -- --ignored --test-threads=1 --nocapture
          if [[ "$RUNNER_OS" == "macOS" ]]; then cargo test --locked -p serial-workbench-host --lib native_macos_ -- --ignored --test-threads=1; fi
      - name: 定向验证 Host 管道和自动恢复
        if: inputs.suite == 'host-ipc'
        shell: bash
        run: |
          cargo build --locked -p serial-workbench-cli -p serial-workbench-mcp
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export SWB_TEST_CLI_BIN="$PWD/src-tauri/target/debug/serial-workbench-cli$suffix"
          export SWB_TEST_MCP_BIN="$PWD/src-tauri/target/debug/serial-workbench-mcp$suffix"
          cargo test --locked -p serial-workbench-host --lib -- --ignored --test-threads=1 --nocapture \
            native_node_task_derived_lane_preserves_raw_control_and_capture \
            native_node_task_raw_lane_bounds_reads_preserves_control_and_capture \
            restart_automatically_registers_without_replaying_tasks
      - name: 定向验证 macOS 进程签名
        if: inputs.suite == 'macos-signature'
        shell: bash
        run: |
          cargo test --locked -p serial-workbench-host --test node_packages \
            verified_backend_schema_lookup_budget_uses_actual_prepared_fragment_id_keys -- --ignored --test-threads=1 --nocapture
          cargo build --locked -p serial-workbench-host --example node_runtime_probe
          pnpm test:runtime --target "$RUNTIME_TARGET" --resources "$SWB_NODE_RUNTIME_TEST_ROOT" --probe src-tauri/target/debug/examples/node_runtime_probe --output artifacts/runtime-preflight
      - name: 保留 runtime 专项收据与签名来源
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-preflight-${{ matrix.target }}
          path: |
            artifacts/runtime-preflight/**/suite.json
            artifacts/runtime-preflight/**/failure.json
            artifacts/runtime-preflight/**/receipt.json
            artifacts/runtime-preflight/**/command.stdout
            artifacts/runtime-preflight/**/command.stderr
            artifacts/runtime-preflight/**/command-error.txt
            artifacts/runtime-preflight/**/probe.stdout
            artifacts/runtime-preflight/**/probe.stderr
            artifacts/runtime-preflight/**/probe-io.txt
            artifacts/offline-installer/*.log
            artifacts/offline-installer/*.txt
            artifacts/offline-installer/*.sb
            artifacts/offline-installer/components.json
            artifacts/offline-installer/reference-*/signed-*.json
            artifacts/windows-nsis-stage/installer-layout.log
            .cache/node-runtime/layouts/**/runtime-preparation.json
            .cache/node-runtime/layouts/**/node-resigning.json
            .cache/node-runtime/layouts/**/node-sign*.stdout
            .cache/node-runtime/layouts/**/node-sign*.stderr
            .cache/node-runtime/layouts/**/resources/runtime/node-image.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保留 runtime 失败夹具与来源现场
        if: failure() && !endsWith(inputs.suite, '-offline-installer')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-preflight-failures-${{ matrix.target }}
          path: |
            artifacts/runtime-preflight
            .cache/node-runtime
            artifacts/rust-failures/node-runtime-*/**
            artifacts/rust-failures/node-backend-*/**
            artifacts/rust-failures/host-node-backend-*/**
            artifacts/rust-failures/host-node-task-derived-*/derived.events
            artifacts/rust-failures/macos-node-before-auth-*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: 标记专项验证范围
        if: always()
        shell: bash
        env:
          RUNTIME_SUITE: ${{ inputs.suite }}
        run: |
          echo "运行时专项预检套件为 $RUNTIME_SUITE，仅计入已运行的用例。里程碑仍以完整四目标门禁为准。" >> "$GITHUB_STEP_SUMMARY"
