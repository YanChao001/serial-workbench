name: 依赖审计

# 里程碑或依赖评审时由维护者手动审计
# 发现已知漏洞时检查失败；无法升级时按 security.md 记录原因与缓解措施
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: npm 依赖审计
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # 只读锁文件，不需要安装依赖。发现漏洞时退出码非零
      - name: 审计 npm 依赖
        run: pnpm audit

  cargo-audit:
    name: Rust 依赖审计
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Rust 工具链
        run: rustup toolchain install

      # 直接使用 cargo-audit 的退出码，发现漏洞时让 job 失败。
      # audit-check action 默认查仓库根目录，且报告 issue/check 需要额外写权限。
      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked

      - name: 审计 Rust 依赖
        run: cargo audit --file src-tauri/Cargo.lock
