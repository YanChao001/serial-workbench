name: 原生桌面检查

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  desktop-e2e:
    name: 原生桌面检查
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: bash scripts/ci-linux-deps.sh native

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/package.json

      - name: 安装依赖与 Rust 工具链
        run: |
          pnpm install --frozen-lockfile
          rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> src-tauri/target/e2e
          key: e2e-${{ inputs.target }}
          # 保留已成功编译的依赖缓存，桌面断言失败后仍可复用。
          cache-on-failure: true

      # 仅 feature=e2e 带内嵌 WebDriver，使用 .e2e 标识及临时用户数据。
      - name: 构建测试专用桌面应用
        run: pnpm e2e:build

      - name: 桌面 E2E（Windows / macOS）
        if: runner.os != 'Linux'
        run: pnpm test:e2e --interactive --skip-build

      - name: 桌面 E2E（Linux）
        if: runner.os == 'Linux'
        env:
          WEBKIT_DMABUF_RENDERER_FORCE_SHM: "1"
        run: |
          mkdir -p artifacts/e2e/crash
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/artifacts/e2e/crash/core.%p"
          ulimit -c unlimited
          dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/serial-workbench-openbox.log 2>&1 & pnpm test:e2e --interactive --skip-build'

      - name: 保存 Linux 应用崩溃的原生线程栈
        if: failure() && runner.os == 'Linux'
        run: |
          if [[ ! -f src-tauri/target/e2e/build.json ]]; then
            echo "本次测试程序尚未构建，没有可读取的应用崩溃栈。"
            exit 0
          fi
          binary="$(node --input-type=module -e 'import { readE2EBuild } from "./e2e/build.mjs"; process.stdout.write(readE2EBuild());')"
          shopt -s nullglob
          found=0
          for native_log in artifacts/e2e/*/native.log; do
            pid="$(sed -n 's/.*owned-process-exit .* pid=\([0-9][0-9]*\)$/\1/p' "$native_log" | tail -n 1)"
            [[ "$pid" =~ ^[0-9]+$ ]] || continue
            core="artifacts/e2e/crash/core.$pid"
            [[ -f "$core" ]] || continue
            found=1
            backtrace="artifacts/e2e/crash/app-$pid.backtrace.txt"
            if ! timeout --kill-after=5s 60s gdb --batch --quiet "$binary" "$core" \
              -ex 'set pagination off' -ex 'info threads' -ex 'thread apply all bt' > "$backtrace" 2>&1; then
              echo "gdb 未完整结束，已保留可取得的线程栈：$backtrace"
            fi
            # 只保留文本栈；core 属于本次隔离应用且可能包含大块进程内存。
            rm -f -- "$core"
          done
          if (( found == 0 )); then
            echo "没有发现本次主程序的 core dump；保留原有进程退出记录。"
          fi

      - name: 保留原生收据、截图与测试日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-${{ inputs.target }}
          path: |
            artifacts/e2e
            !artifacts/e2e/crash/core.*
          if-no-files-found: ignore
