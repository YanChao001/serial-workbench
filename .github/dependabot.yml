version: 2

# 依赖更新通过 PR，记录适用本机检查；积累到里程碑时手动运行 CI
# 依赖升级需验证构建及 WebView 兼容性，不自动合并
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    pull-request-branch-name:
      prefix: "chore"
      template: "{prefix}/deps-{name}"
      word-separator: "-"
      branch-name-case: "lowercase"

  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    pull-request-branch-name:
      prefix: "chore"
      template: "{prefix}/deps-{name}"
      word-separator: "-"
      branch-name-case: "lowercase"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    pull-request-branch-name:
      prefix: "chore"
      template: "{prefix}/deps-{name}"
      word-separator: "-"
      branch-name-case: "lowercase"
