packages:
  - "packages/*"

# 缓存随项目位于同一磁盘，避免跨盘硬链接回退。
storeDir: .pnpm-store
updateNotifier: false

allowBuilds:
  esbuild: true
  edgedriver: false
  geckodriver: false

# 上游更新依赖范围前，覆盖 WDIO 9 工具链的相关依赖：
# 使用已修复的 glob / serializer / diff，移除 Mocha 的 braces 依赖，
# 并避免浏览器工具链引入未修复的 extract-zip。
overrides:
  "glob@>=10.2.0 <10.5.0": 10.5.0
  "@wdio/mocha-framework>mocha": 11.8.0
  "mocha>serialize-javascript": 7.1.3
  "mocha>diff": 8.0.3
  "@wdio/utils>@puppeteer/browsers": 3.2.5
