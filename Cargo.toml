[workspace]
members = ["src-tauri", "crates/core", "crates/ipc", "crates/host", "crates/client", "crates/cli", "crates/mcp"]
default-members = ["crates/core", "crates/ipc", "crates/host", "crates/client", "crates/cli", "crates/mcp"]
exclude = ["third-party/global-hotkey"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[patch.crates-io]
global-hotkey = { path = "third-party/global-hotkey" }

# 图片解码沿用现有优化，继续复用 src-tauri/target 缓存。
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# 固定 Node 的完整摘要校验也在调试和测试构建中运行。
[profile.dev.package."sha2@0.10.9"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
